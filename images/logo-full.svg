<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 100" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="fullBrandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>
    <linearGradient id="fullAquaAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
  </defs>

  <!-- ICON -->
  <g transform="translate(6, 6)">
    <rect x="0" y="0" width="88" height="88" rx="22" fill="url(#fullBrandGrad)" />
    <!-- 4 panes -->
    <rect x="14" y="14" width="26" height="26" rx="5" fill="#ffffff" fill-opacity="0.95" />
    <path d="M18 14 L28 14 L14 28 L14 18 Z" fill="#bae6fd" />
    <rect x="48" y="14" width="26" height="26" rx="5" fill="#ffffff" fill-opacity="0.92" />
    <path d="M52 14 L62 14 L48 28 L48 18 Z" fill="#bae6fd" />
    <rect x="14" y="48" width="26" height="26" rx="5" fill="#ffffff" fill-opacity="0.88" />
    <rect x="48" y="48" width="26" height="26" rx="5" fill="#ffffff" fill-opacity="0.88" />
    <!-- Crosshair Center Ring -->
    <circle cx="44" cy="44" r="8" fill="#0284c7" stroke="#ffffff" stroke-width="2.5" />
    <circle cx="44" cy="44" r="3" fill="#38bdf8" />
    <!-- Squeegee swipe -->
    <rect x="38" y="38" width="34" height="4" rx="2" transform="rotate(-32 38 38)" fill="url(#fullAquaAccent)" />
    <!-- Sparkle -->
    <path d="M68 10 C68 15 72 16 72 16 C72 16 68 17 68 22 C68 17 64 16 64 16 C64 16 68 15 68 10 Z" fill="#facc15" />
  </g>

  <!-- TYPOGRAPHY -->
  <g transform="translate(112, 18)">
    <text x="0" y="38" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-weight="900" font-size="34" fill="#0f2942" letter-spacing="-0.5">ACCURATE</text>
    <!-- KAMLOOPS BADGE -->
    <rect x="195" y="16" width="86" height="24" rx="6" fill="#f0f9ff" stroke="#bae6fd" stroke-width="1.5" />
    <text x="238" y="33" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-weight="800" font-size="11" fill="#0369a1" letter-spacing="1.2" text-anchor="middle">KAMLOOPS</text>
    <!-- SUBTITLE -->
    <text x="2" y="60" font-family="'Inter', system-ui, -apple-system, sans-serif" font-weight="700" font-size="11.5" fill="#64748b" letter-spacing="1.8">WINDOW CLEANING &amp; POWER WASHING</text>
  </g>
</svg>